<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>RegressionBall • Day 2</title><style>
:root{--bg:#101e31;--panel:#1b304b;--panel2:#243c5a;--line:#344d6b;--text:#edf5ff;--muted:#bdcce0;--gold:#ffd16a;--mint:#64dfc6;--red:#ff8997;--blue:#8bb8ff}*{box-sizing:border-box}body{background:var(--bg);color:var(--text);font:17px/1.55 system-ui,Segoe UI,sans-serif;margin:0}header{background:#13243a;border-bottom:1px solid var(--line);padding:17px max(18px,calc((100vw - 1100px)/2));position:sticky;top:0;z-index:10;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}header b{font-size:1.25rem}main{max-width:1100px;margin:25px auto;padding:0 18px 45px}h1{font-size:clamp(27px,4vw,42px);line-height:1.16;margin:8px 0 12px}h2{font-size:23px;margin:0 0 10px}h3{margin:20px 0 7px}p{margin:8px 0 14px}.muted{color:var(--muted)}.card{background:var(--panel);border:1px solid var(--line);padding:22px;border-radius:16px;margin:16px 0}.learn{background:#283a4c;border-left:6px solid var(--gold)}.learn strong{color:var(--gold)}.pill{display:inline-block;background:#264661;color:var(--mint);padding:4px 10px;border-radius:25px;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.06em}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.question{border-top:1px solid var(--line);padding-top:15px;margin-top:15px}label{display:block;font-weight:700;margin:12px 0 7px}input,textarea,select{background:#0e2035;color:var(--text);border:1px solid #54708f;border-radius:9px;padding:12px;font:inherit;width:100%}textarea{min-height:84px;resize:vertical}input[type=range]{accent-color:var(--gold);padding:0}button{border:0;background:var(--gold);color:#122033;font:700 16px system-ui;padding:11px 17px;border-radius:10px;cursor:pointer}button.secondary{background:#314c6a;color:var(--text)}button:disabled{opacity:.5;cursor:wait}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0}.pages{display:flex;flex-wrap:wrap;gap:7px}.pages button{padding:7px 10px;font-size:13px;background:#2c4661;color:white}.pages button.active{background:var(--mint);color:#112034}.pages button.locked{opacity:.6}canvas{display:block;width:100%;height:auto;background:#14253c;border-radius:12px;border:1px solid var(--line)}.figure{margin:16px 0}.figure svg{display:block;width:100%;max-height:250px;background:#14253c;border-radius:12px;border:1px solid var(--line)}.figure figcaption{font-size:13px;color:var(--muted);margin-top:6px}.notes{font-size:14px;color:var(--muted)}.key{color:var(--gold);font-weight:700}.error{color:#ffabb6}.ok{color:#84f1b1}.hidden{display:none!important}table{border-collapse:collapse;width:100%;font-size:15px}td,th{border-bottom:1px solid var(--line);padding:8px;text-align:right}td:first-child,th:first-child{text-align:left}th{background:#263e59}.scroll{overflow-x:auto}.sectionhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.small{font-size:14px}.readout{background:#14263d;border-radius:10px;padding:12px;margin:12px 0}.submission{background:#253a50;border:1px solid #607590;border-radius:16px;padding:17px;margin-top:18px}.submission input{max-width:370px}.row{display:flex;align-items:end;gap:12px;flex-wrap:wrap}.row>div{flex:1;min-width:190px}#submitStatus{min-height:20px;font-size:14px}a{color:var(--mint)}@media(max-width:600px){header{position:static}.card{padding:15px}main{margin-top:14px}}
</style></head><body>
<header><div><b>REGRESSIONBALL <span style="color:var(--gold)">DAY 2</span></b><div class="small muted">Predict • Compare • Adjust • Explain</div></div><nav class="pages" id="pageNav"></nav></header>
<main><div id="app"></div></main>
<script>
const PAGES=[
 {name:'Regression',pass:'cereal',big:'Classification predicts a category. Regression predicts a number.',learn:'Regression finds a numerical relationship in data to estimate an unknown value. It is not a promise that the prediction will be exact.',questions:[['Which task uses regression?',['Predict the number of tickets sold','Predict whether a movie is comedy or horror','Sort emails into spam or inbox'],0],['What does a regression model usually output?',['A numerical value','A category label','Only true or false'],0]],prompt:'A theater wants to predict ticket sales. Explain why regression is a better choice than classification for this particular question.',visual:'types'},
 {name:'Patterns & data',pass:'greenies',big:'The dataset contains observations; the scatterplot helps us see the relationship.',learn:'Each point on a scatterplot is one example with an input (ad dollars) and an output (tickets sold). A pattern is useful even when the points do not line up perfectly.',questions:[['What does one dot represent?',['One real observation from the dataset','The entire model','A model prediction for all budgets'],0],['What is the feature (input) here?',['Amount spent on advertising','Tickets sold','The prediction error'],0]],prompt:'Look at the dots. What happens to ticket sales as advertising spending grows? Name one reason the relationship might not be perfect.',visual:'scatter'},
 {name:'Line of best fit',pass:'chicken',big:'The model uses a line to represent the overall pattern, not to memorize every observation.',learn:'This example has the fitted equation: predicted tickets = 0.2 × ad dollars + 20. Its line is chosen to keep overall squared prediction errors small, not to pass through each point.',questions:[['What is a line of best fit?',['A line representing the overall relationship','A line connecting each dot in order','A line that guarantees perfect predictions'],0],['In tickets = 0.2 × dollars + 20, what happens when ad spending goes up $100?',['Predicted tickets increase by 20','Predicted tickets increase by 100','Predicted tickets decrease by 20'],0]],prompt:'Using the equation, predict ticket sales for $700 in ads. Show or explain your calculation.',visual:'line'},
 {name:'Prediction error',pass:'steak',big:'A prediction is an estimate. Error measures how far it misses reality.',learn:'Prediction error = predicted − actual. The signed error tells you whether the prediction was too high or too low. Absolute error uses the size of the miss; positive and negative errors cannot cancel each other out.',questions:[['A model predicts 150 tickets; 170 are sold. What is predicted − actual?',['−20','+20','0'],0],['Why not simply average signed errors?',['Positive and negative errors can cancel','We never know actual values','All errors are positive'],0]],prompt:'At $850 in ads the model predicts 190 tickets, but 214 are sold. Find the signed error and absolute error. What does the result tell you?',visual:'error'},
 {name:'Learning & judging',pass:'treats',big:'Use separate training and testing data. Inspect the evidence, then evaluate the model.',learn:'Dataset → Train → Test → Inspect → Evaluate. Training fits the relationship; testing checks predictions on observations not used for fitting. Inspect means identify patterns and mistakes. Evaluate means judge how useful and trustworthy the model is.',questions:[['What is the job of test data?',['Check the model using examples not used to train it','Force the model to memorize every observation','Remove all prediction errors'],0],['Which statement is an evaluation?',['The model misses by too much to trust for large budgets','The graph contains eight green dots','The points trend upward'],0]],prompt:'A model fits its training data well but makes large errors on new advertising budgets. Would you trust it? Explain using the terms train and test.',visual:'process'}
];
const TRAIN=[[100,45],[200,57],[300,78],[400,98],[500,117],[600,145]];
const TEST=[[650,168],[750,156],[850,214],[950,198]];
const state={page:0,unlock:0,answers:{},choices:{},final:{slope:.15,intercept:35,retrained:false,checked:false},name:''};
const id=(s)=>document.getElementById(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{}; // All work stays in memory until manual submission.
const renderNav=()=>{id('pageNav').innerHTML=[...PAGES.map((p,i)=>`<button class="${state.page===i?'active':''} ${i>state.unlock?'locked':''}" onclick="go(${i})">${i+1}. ${p.name}${i>state.unlock?' 🔒':''}</button>`),`<button class="${state.page===5?'active':''} ${state.unlock<5?'locked':''}" onclick="go(5)">6. Investigation${state.unlock<5?' 🔒':''}</button>`].join('')};
const go=i=>{if(i>state.unlock){unlock(i);return}state.page=i;render();window.scrollTo(0,0)};
function unlock(i){const word=prompt(`Password for ${i===5?'Final Investigation':PAGES[i].name}:`);if(word===null)return;let correct=PAGES[i-1].pass; // each topic gives the password to the next page
if(word.trim().toLowerCase()===correct||word.trim().toLowerCase()==='everything') {state.unlock=Math.max(state.unlock,i);save();go(i)}else alert('Incorrect password. Try again.');}
function continueNext(){const dest=state.page+1;if(dest>5)return;if(dest<=state.unlock)go(dest);else unlock(dest)}
function storeText(key,val){state.answers[key]=val}
function storeChoice(key,val){state.choices[key]=val===''?null:Number(val)}
function nextBtn(){return `<div class="controls"><button onclick="continueNext()">${state.page===4?'Go to final investigation':'Continue to next topic'} →</button></div>`}
function visual(type){if(type==='types')return `<div class="figure"><svg viewBox="0 0 700 185" role="img" aria-label="Classification sorts categories while regression predicts numbers"><rect x="18" y="21" width="305" height="140" rx="12" fill="#213955"/><rect x="378" y="21" width="305" height="140" rx="12" fill="#213955"/><text x="170" y="57" fill="#fff" font-size="21" text-anchor="middle">CLASSIFICATION</text><text x="170" y="104" fill="#64dfc6" font-size="25" text-anchor="middle">Comedy / Horror</text><text x="530" y="57" fill="#fff" font-size="21" text-anchor="middle">REGRESSION</text><text x="530" y="104" fill="#ffd16a" font-size="25" text-anchor="middle">152 tickets</text><text x="530" y="133" fill="#bdcce0" font-size="15" text-anchor="middle">a predicted number</text></svg><p class="notes">Regression predicts a numerical output from a feature, such as advertising spending.</p><canvas id="topicGraph" width="920" height="355" role="img" aria-label="Working regression example: advertising spending versus tickets, with a fitted line"></canvas></div>`;
if(type==='process')return `<div class="figure"><svg viewBox="0 0 800 170" role="img" aria-label="Five steps dataset train test inspect evaluate">${['DATASET','TRAIN','TEST','INSPECT','EVALUATE'].map((t,i)=>`<rect x="${8+i*160}" y="28" width="145" height="95" rx="12" fill="${i===4?'#615038':'#274363'}" stroke="#7fa2c7"/><text x="${80+i*160}" y="66" fill="#fff" font-size="22" text-anchor="middle">${i+1}</text><text x="${80+i*160}" y="95" fill="${i===4?'#ffd16a':'#64dfc6'}" font-size="17" font-weight="bold" text-anchor="middle">${t}</text>`).join('')}</svg></div>`;
return `<div class="figure"><canvas id="topicGraph" width="920" height="355" role="img" aria-label="Advertising money plotted against tickets sold"></canvas><figcaption>Green = actual observations · Yellow = regression line / prediction · Pink = prediction error</figcaption></div>`}
function plot(canvas,opts={}){if(!canvas)return;let ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height,left=70,right=35,top=30,bottom=53;ctx.clearRect(0,0,W,H);ctx.fillStyle='#14253c';ctx.fillRect(0,0,W,H);const xMin=0,xMax=1000,yMax=250;const px=x=>left+x/xMax*(W-left-right),py=y=>H-bottom-y/yMax*(H-top-bottom);ctx.strokeStyle='#37506a';ctx.lineWidth=1;ctx.font='15px system-ui';ctx.fillStyle='#ccd9e9';ctx.textAlign='right';for(let y=0;y<=250;y+=50){ctx.beginPath();ctx.moveTo(left,py(y));ctx.lineTo(W-right,py(y));ctx.stroke();ctx.fillText(y,left-10,py(y)+5)}ctx.textAlign='center';for(let x=0;x<=1000;x+=200)ctx.fillText('$'+x,px(x),H-bottom+25);ctx.fillText('Money spent on advertising',W/2,H-10);ctx.save();ctx.translate(20,H/2);ctx.rotate(-Math.PI/2);ctx.fillText('Tickets sold',0,0);ctx.restore();if(opts.line){ctx.strokeStyle='#ffd16a';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(px(0),py(opts.intercept??20));ctx.lineTo(px(1000),py((opts.slope??.2)*1000+(opts.intercept??20)));ctx.stroke()}
const dot=(x,y,color,r=7)=>{ctx.beginPath();ctx.arc(px(x),py(y),r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();ctx.strokeStyle='#14253c';ctx.lineWidth=2;ctx.stroke()};for(const [x,y] of TRAIN)dot(x,y,'#64dfc6',8);if(opts.mode==='error'){for(const [x,y] of TEST){const q=.2*x+20;ctx.strokeStyle='#ff8997';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(px(x),py(q));ctx.lineTo(px(x),py(y));ctx.stroke();dot(x,q,'#ffd16a',7);dot(x,y,'#ff8997',8)}}if(opts.mode==='test'){for(const [x,y] of TEST){let q=opts.slope*x+opts.intercept;ctx.strokeStyle='#ff8997';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(px(x),py(q));ctx.lineTo(px(x),py(y));ctx.stroke();dot(x,q,'#ffd16a',7);dot(x,y,'#ff8997',8)}}}
function renderTopic(i){let p=PAGES[i];id('app').innerHTML=`<span class="pill">Topic ${i+1} of 5</span><h1>${p.name}</h1><section class="card learn"><strong>BIG IDEA</strong><h2>${p.big}</h2><p>${p.learn}</p></section>${i===0?`<section class="card"><span class="pill">Do Now</span><h2>Before we begin</h2>${finalAnswer('do1','1. What is the difference between a linear classifier and a regression model?')}${finalAnswer('do2','2. A model predicts 120 tickets, but only 105 sell. What is the prediction error?')}</section>`:''}<section class="card"><h2>See it</h2>${visual(p.visual)}</section><section class="card"><h2>Check your understanding</h2><p class="muted">Two vocabulary questions and one short explanation. You may skip anything and still submit.</p>${p.questions.map((q,j)=>{let key=`p${i}q${j}`;return `<div class="question"><label for="${key}">${j+1}. ${q[0]}</label><select id="${key}" onchange="storeChoice('${key}',this.value)"><option value="">Choose an answer…</option>${q[1].map((opt,k)=>`<option value="${k}" ${state.choices[key]===k?'selected':''}>${esc(opt)}</option>`).join('')}</select></div>`}).join('')}<div class="question"><label for="fr${i}">3. Explain: ${p.prompt}</label><textarea id="fr${i}" placeholder="Write 2–4 thoughtful sentences…" oninput="storeText('fr${i}',this.value)">${esc(state.answers['fr'+i]||'')}</textarea></div></section>${nextBtn()}`;if(['types','scatter','line','error'].includes(p.visual))plot(id('topicGraph'),{line:p.visual!=='scatter',mode:p.visual==='error'?'error':undefined,slope:.2,intercept:20})}
function fit(points){let n=points.length,mx=points.reduce((s,a)=>s+a[0],0)/n,my=points.reduce((s,a)=>s+a[1],0)/n;let numer=points.reduce((s,a)=>s+(a[0]-mx)*(a[1]-my),0),denom=points.reduce((s,a)=>s+(a[0]-mx)**2,0);let m=numer/denom;return [m,my-m*mx]}
const fmt=n=>Number(n).toFixed(1);
function finalAnswer(key,label,placeholder='Explain your reasoning…'){return `<label for="${key}">${label}</label><textarea id="${key}" placeholder="${placeholder}" oninput="storeText('${key}',this.value)">${esc(state.answers[key]||'')}</textarea>`}
function renderFinal(){const f=state.final;id('app').innerHTML=`<span class="pill">Final Investigation • 25–30 minutes</span><h1>Can we trust this prediction?</h1><p class="muted">You work for a movie theater. Your job is to test a model predicting ticket sales from its advertising budget. Follow the same five steps as the slides. No section is required for submission.</p>
<section class="card learn"><strong>THE BIG IDEA</strong><h2>Data → Train → Test → Inspect → Evaluate</h2><p>A useful regression model is not necessarily perfect. Build a line, measure how far it misses, and decide whether you would actually use it.</p></section>
<section class="card"><div class="sectionhead"><span class="pill">Step 1 • Dataset • 3 minutes</span><h2>What do we know?</h2></div><p>Six observations are training data. Four newer observations are reserved for testing. The model must not see the test values until after you have chosen a line.</p><div class="grid"><div><h3>Training observations</h3><div class="scroll"><table><thead><tr><th>Ad spend</th><th>Tickets</th></tr></thead><tbody>${TRAIN.map(a=>`<tr><td>$${a[0]}</td><td>${a[1]}</td></tr>`).join('')}</tbody></table></div></div><div><h3>Reserved testing budgets</h3><div class="scroll"><table><thead><tr><th>Ad spend</th><th>Actual sales</th></tr></thead><tbody>${TEST.map(a=>`<tr><td>$${a[0]}</td><td>${f.checked?a[1]:'Hidden until testing'}</td></tr>`).join('')}</tbody></table></div></div></div>${finalAnswer('f_dataset','Why should we keep the testing values separate from the training values?')}</section>
<section class="card"><div class="sectionhead"><span class="pill">Step 2 • Train • 7 minutes</span><h2>Build your first prediction line</h2></div><p>Adjust the two controls to create a line that follows the training data. Do not try to touch every dot. Your mission is to find a useful overall pattern.</p><div class="grid"><div><label for="slope">Rate: tickets per ad dollar <span class="key" id="slopeValue"></span></label><input type="range" id="slope" min="0.08" max="0.35" step="0.01" value="${f.slope}" oninput="updateModel()"><label for="intercept">Starting value <span class="key" id="interceptValue"></span></label><input type="range" id="intercept" min="0" max="70" step="1" value="${f.intercept}" oninput="updateModel()"><div class="readout" id="equation"></div><button class="secondary" onclick="autoTrain()">Train automatically (find best-fit line)</button></div><div class="readout"><b>Training error summary</b><div id="trainingError"></div><p class="notes">Mean absolute error (MAE) averages the sizes of the errors, so negatives and positives cannot cancel.</p></div></div><div class="figure"><canvas id="finalGraph" width="920" height="355"></canvas></div>${finalAnswer('f_train','Compare your line with the automatic best-fit line. What changed? Why does the line not need to touch every point?')}</section>
<section class="card"><div class="sectionhead"><span class="pill">Step 3 • Test • 6 minutes</span><h2>Put the model on trial</h2></div><p>Before clicking Test, estimate ticket sales for $850 of advertising using your current equation. Then reveal the four held-out observations.</p>${finalAnswer('f_predict','My prediction for $850 in advertising is… (show your calculation).','Use your line equation…')}<div class="controls"><button onclick="revealTest()">Test my current model</button><span class="muted small">This reveals new actual values. You can test again after adjusting the line.</span></div><div id="testResults"></div></section>
<section class="card"><div class="sectionhead"><span class="pill">Step 4 • Inspect • 6 minutes</span><h2>What patterns do you notice?</h2></div><p>Use the plot and test table. Compare which predictions are close, which miss, and whether the line is systematically above or below actual sales.</p>${finalAnswer('f_inspect','Which test budget has the largest absolute error? What is the error? Use evidence from the results.')}${finalAnswer('f_pattern','Do the test results suggest a pattern in the errors, or is the relationship simply imperfect? Explain.')}</section>
<section class="card"><div class="sectionhead"><span class="pill">Step 5 • Evaluate • 6 minutes</span><h2>Should the theater trust it?</h2></div><p>The theater wants to plan advertising for a larger movie release. Consider both the numbers and what the model might be missing.</p>${finalAnswer('f_evaluate','Would you trust this model to estimate tickets for a $1,200 ad budget? Defend your answer using testing evidence and at least one limitation (outliers, extrapolation, missing factors).')}${finalAnswer('f_decide','Your final recommendation: use the model as-is, retrain it, or collect better data? Explain why.')}<p class="notes">Challenge extension: Which additional feature could improve this model (movie popularity, release date, ticket price, etc.)? Why?</p>${finalAnswer('f_extension','Optional extension: Suggest a second feature and explain its value.')}</section>
<section class="card"><span class="pill">Exit Ticket</span><h2>What did you learn?</h2>${finalAnswer('exit1',"1. Why doesn't a line of best fit need to pass through every data point?")}${finalAnswer('exit2','2. A model predicts 200 tickets will sell, but only 170 are sold. Explain what the error tells us about the prediction.')}</section>
<section class="submission"><h2>Submit your work</h2><p><strong>Only your name is required.</strong> Every answer and every step of the investigation is optional. Your submission includes whatever you completed.</p><label for="studentName">First and last name</label><input id="studentName" autocomplete="name" placeholder="First Last" value="${esc(state.name)}" oninput="state.name=this.value"><div class="controls"><button id="submitBtn" onclick="submitWork()">Submit work to Firebase</button><button class="secondary" onclick="exportWork()">Download backup (optional)</button></div><p id="submitStatus" role="status" aria-live="polite"></p><p class="notes">No autosave. Your work stays on this page until you submit. Firebase submission is confirmed only when a success message appears. Keep this tab open until you see it.</p></section><div class="controls"><button class="secondary" onclick="go(4)">← Back to review</button></div>`;updateModel(false);renderTest()}
function MAE(arr,m,b){return arr.reduce((s,[x,y])=>s+Math.abs((m*x+b)-y),0)/arr.length}
function updateModel(persist=true){let f=state.final;if(id('slope')){f.slope=Number(id('slope').value);f.intercept=Number(id('intercept').value)}id('slopeValue').textContent=fmt(f.slope);id('interceptValue').textContent=fmt(f.intercept);id('equation').innerHTML=`<span class="key">predicted tickets = ${fmt(f.slope)} × ad dollars + ${fmt(f.intercept)}</span>`;id('trainingError').innerHTML=`Mean absolute training error: <span class="key">${fmt(MAE(TRAIN,f.slope,f.intercept))} tickets</span>`;plot(id('finalGraph'),{line:true,slope:f.slope,intercept:f.intercept,mode:f.checked?'test':null});renderTest();if(persist)save()}
function autoTrain(){let [m,b]=fit(TRAIN);state.final.slope=Number(m.toFixed(2));state.final.intercept=Math.round(b);id('slope').value=state.final.slope;id('intercept').value=state.final.intercept;state.final.retrained=true;updateModel();}
function revealTest(){state.final.checked=true;save();renderFinal();id('testResults').scrollIntoView({behavior:'smooth',block:'center'})}
function renderTest(){let el=id('testResults');if(!el)return;let f=state.final;if(!f.checked){el.innerHTML='<p class="notes">Test values are hidden until you choose to test the model.</p>';return}el.innerHTML=`<div class="scroll"><table><thead><tr><th>Budget</th><th>Predicted</th><th>Actual</th><th>Signed error</th><th>Absolute error</th></tr></thead><tbody>${TEST.map(([x,y])=>{let q=f.slope*x+f.intercept;return `<tr><td>$${x}</td><td>${fmt(q)}</td><td>${y}</td><td>${fmt(q-y)}</td><td>${fmt(Math.abs(q-y))}</td></tr>`}).join('')}</tbody></table></div><div class="readout"><b>Mean absolute test error: <span class="key">${fmt(MAE(TEST,f.slope,f.intercept))} tickets</span></b><p class="notes">Changing the training controls will update these results, but remember: repeatedly tuning to test data weakens it as a fair test!</p></div>`}
function render(){renderNav();if(state.page<5)renderTopic(state.page);else renderFinal()}
window.go=go;window.continueNext=continueNext;window.storeText=storeText;window.storeChoice=storeChoice;window.updateModel=updateModel;window.autoTrain=autoTrain;window.revealTest=revealTest;
function payload(){return {studentName:state.name.trim(),lesson:'RegressionBall Day 2',version:1,answers:state.answers,choice:state.choices,model:{...state.final},lastPage:state.page,unlockedThrough:state.unlock,completion:'partial-allowed',clientDate:new Date().toISOString()}}
function exportWork(){let data=JSON.stringify(payload(),null,2),blob=new Blob([data],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='regressionball-day2-'+(state.name.trim().replace(/[^a-z0-9-]/gi,'_')||'draft')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}
window.getRegressionPayload=payload;
window.exportWork=exportWork;
render();
</script>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getFirestore,collection,addDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const config={apiKey:'AIzaSyA-MuWgWxgLKbfcXPfH16SlSazbQp4UYy0',authDomain:'regressionball.firebaseapp.com',projectId:'regressionball',storageBucket:'regressionball.firebasestorage.app',messagingSenderId:'243024495064',appId:'1:243024495064:web:dc2009ce99e6093275f2ad'};
let db;
try { db=getFirestore(initializeApp(config)); } catch(err){ console.error('Firebase init:',err); }
window.submitWork=async()=>{
 const name=document.getElementById('studentName')?.value.trim()||'';
 const status=document.getElementById('submitStatus');
 const submit=document.getElementById('submitBtn');
 if(!name){status.className='error';status.textContent='Enter your name. No other answer is required.';return;}
 submit.disabled=true;status.className='muted';status.textContent='Submitting to Firebase…';
 try{
   if(!db)throw Error('Firebase did not initialize.');
   const data=window.getRegressionPayload();data.studentName=name;data.createdAt=serverTimestamp();
   const ref=await addDoc(collection(db,'submissions'),data);
